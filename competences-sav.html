<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- v405 : « Compétences SAV » (page fournie par Gabriel, artefact Claude) reprise telle quelle dans SAV / MES › Compétences -->
<title>Compétences SAV</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : barre d'outils collante, matrice équipe × catégories en vue d'ouverture, fiche individuelle avec radar + échelle de niveaux détaillée par compétence */
:root{
  --bg:#edf0f2; --surface:#ffffff; --surface2:#f4f6f7; --ink:#13202a; --muted:#566673; --line:#d2d9df;
  --accent:#0a6b7c; --accent-ink:#ffffff; --target:#b8481a; --good:#2b7a4b; --warn:#a8680f;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1519; --surface:#16212a; --surface2:#1b2832; --ink:#e4ebef; --muted:#92a2ad; --line:#2a3945;
  --accent:#44b5c8; --accent-ink:#06222a; --target:#f19058; --good:#5cc489; --warn:#e0a24a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1519; --surface:#16212a; --surface2:#1b2832; --ink:#e4ebef; --muted:#92a2ad; --line:#2a3945;
  --accent:#44b5c8; --accent-ink:#06222a; --target:#f19058; --good:#5cc489; --warn:#e0a24a; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:12px}
.brand{min-width:0;flex:1 1 220px}
.brand h1{font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.04em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.brand b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:var(--r);border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:4px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.hz{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.hz select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-family:var(--f-mono);font-size:13px;color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;padding:14px 16px 0}
.panel-h h2{font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.hint{color:var(--muted);font-size:13px;margin:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{border-color:var(--target);color:var(--target)}
.btn.sm{padding:3px 9px;font-size:13px}

/* matrice */
.mx-scroll{overflow-x:auto;padding:12px 16px 16px}
table.mx{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
.mx th,.mx td{padding:0;text-align:center;font-weight:400}
.mx thead th{vertical-align:bottom;padding-bottom:6px}
.mx .c0{text-align:left;font-weight:500;min-width:150px;padding-right:8px;position:sticky;left:0;background:var(--surface);z-index:1}
.mx .grp th{text-align:left;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);padding:10px 0 2px;background:none;position:static}
.ph{background:none;border:0;font-weight:600;padding:2px 4px;border-bottom:2px solid transparent}
.ph:hover{border-color:var(--accent)}
.cell{width:100%;min-width:76px;height:50px;border:1px solid var(--line);border-radius:var(--r);
  background:color-mix(in srgb,var(--accent) calc(var(--p)*1%),var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.cell b{font-family:var(--f-mono);font-weight:500;font-size:16px;line-height:1.1}
.cell i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--target);font-weight:500}
.cell i.ok{color:var(--good)}
.cell:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell.imp::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--warn) transparent transparent;border-top-right-radius:5px}
.mx .avg{color:var(--muted);min-width:64px}
.mx .avg b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.mx tfoot th,.mx tfoot td{padding-top:8px;border-top:1px solid var(--line)}
.mx tfoot .c0{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.freeze{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* sparkline */
.spark{display:block;overflow:visible}
.spark .sk-line{fill:none;stroke:var(--accent);stroke-width:1.6}
.spark .sk-dot{fill:var(--accent)}
.spark .sk-tg{fill:var(--surface);stroke:var(--target);stroke-width:1.6}
.spark .sk-tl{stroke:var(--target);stroke-width:1.2;stroke-dasharray:2 2}
.spark .sk-tick{stroke:var(--line);stroke-width:1}

/* fiche */
.tabs-p{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-weight:500}
.pchip .av{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted)}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pchip[aria-pressed="true"] .av{background:var(--accent);color:var(--accent-ink)}
.fiche{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.fiche{grid-template-columns:minmax(0,1fr)}}
.radar-wrap{padding:8px 8px 12px}
.radar{width:100%;height:auto;display:block}
.radar .rg{fill:none;stroke:var(--line);stroke-width:1}
.radar .rs{stroke:var(--line);stroke-width:1}
.radar .rcur{fill:color-mix(in srgb,var(--accent) 24%,transparent);stroke:var(--accent);stroke-width:2}
.radar .rtg{fill:none;stroke:var(--target);stroke-width:1.6;stroke-dasharray:5 4}
.radar .rd{fill:var(--accent)}
.radar text{fill:var(--ink);font-size:11.5px;font-family:var(--f-body)}
.radar text.rn{fill:var(--muted);font-size:9.5px;font-family:var(--f-mono)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.stat{padding:10px 14px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.crow{border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.grp-h{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);padding:12px 16px 6px;margin:0;font-weight:600;border-top:1px solid var(--line)}
.grp-h:first-child{border-top:0}
.crow-h{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 18px;align-items:center;padding:8px 16px}
.cmain{display:grid;grid-template-columns:minmax(120px,170px) minmax(80px,1fr) 62px;gap:14px;align-items:center;border:0;background:none;text-align:left;padding:6px 0;min-width:0}
.cname{font-weight:500;display:flex;align-items:center;gap:6px}
.cname::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .12s;flex:none}
.crow.open .cname::before{transform:rotate(45deg)}
.ladder{position:relative;height:12px;border-radius:2px;background:var(--surface2);border:1px solid var(--line);
  background-image:linear-gradient(90deg,transparent calc(20% - 1px),var(--line) calc(20% - 1px),var(--line) 20%,transparent 20%);background-size:20% 100%}
.lf{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:1px}
.lt{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--target);border-radius:1px}
.cval{font-family:var(--f-mono);font-size:17px;font-weight:500;text-align:right;white-space:nowrap}
.cval small{display:block;font-size:10px;color:var(--warn);font-weight:400;line-height:1}
.tgt{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.tgt .tv{font-family:var(--f-mono);font-size:15px;color:var(--target);font-weight:500;min-width:34px;text-align:center}
.tgt button{width:24px;height:24px;border:1px solid var(--line);background:var(--surface);border-radius:4px;line-height:1;padding:0}
.tgt button:hover{border-color:var(--target)}
@media (max-width:640px){
  .crow-h{grid-template-columns:minmax(0,1fr) auto}
  .spk{display:none}
  .cmain{grid-template-columns:minmax(0,1fr) 62px}
  .cmain .ladder{grid-column:1 / -1;order:3}
}
.detail{padding:4px 16px 16px;background:var(--surface2);border-top:1px solid var(--line)}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--warn);border-radius:var(--r);background:var(--surface);font-size:13px}
.lvl{margin-top:14px}
.lvl-h{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
.lvl-h h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.lvl-h h3 span{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-right:8px;letter-spacing:0}
.lvl-h .prog{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lvl.done .prog{color:var(--good)}
.sk{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.sk:last-child{border-bottom:0}
.sk.need .st{box-shadow:inset 3px 0 0 var(--target);padding-left:9px}
.sk .st small{display:inline-block;margin-left:8px;font-size:11px;color:var(--target);font-family:var(--f-mono)}
.sk-cols{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:10px}
.sk-cols span{text-align:center}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;display:block;margin:0 auto;position:relative}
.dot.d1{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.d2{border-color:var(--accent);background:var(--accent)}
.dot.self{opacity:.9}
.dot.self.d1,.dot.self.d2{border-color:var(--muted)}
.dot.self.d1{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)}
.dot.self.d2{background:var(--muted)}
.dot:disabled{cursor:default;opacity:.85}
.dot:not(:disabled):hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

/* référentiel */
.ref-grid{display:grid;gap:10px;padding:12px 16px 16px}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr)}}
input[type=text],.sel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
input[type=text]:focus{border-color:var(--accent)}
.rcat{border-top:1px solid var(--line)}
.rcat-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;width:100%;background:none;border:0;text-align:left}
.rcat-h b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.rcat-h span{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
.rbody{padding:0 16px 16px;display:grid;gap:14px}
.rmeta{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:8px}
@media (max-width:560px){.rmeta{grid-template-columns:minmax(0,1fr)}}
.rlvl{display:grid;gap:6px}
.rlvl-h{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center}
.rlvl-h span{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.rsk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-left:42px}
@media (max-width:560px){.rsk{margin-left:0}}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px}
.plink{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.plink .ok{color:var(--good)}
.plink input{max-width:300px}
.lk-res{display:flex;flex-wrap:wrap;gap:6px}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px 16px 16px}
.pc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}
.pc:hover{border-color:var(--accent)}
.pc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc-h b{font-family:var(--f-display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.pc-h span{font-size:12px;color:var(--muted);white-space:nowrap}
.mr{width:100%;height:auto;display:block}
.mr .rg{fill:none;stroke:var(--line);stroke-width:1}
.mr .rs{stroke:var(--line);stroke-width:1}
.mr .ravg{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 3;opacity:.8}
.mr .rcur{fill:color-mix(in srgb,var(--accent) 26%,transparent);stroke:var(--accent);stroke-width:2}
.mr .rtg{fill:none;stroke:var(--target);stroke-width:1.5;stroke-dasharray:4 3}
.mr text{fill:var(--muted);font-size:9.5px;font-family:var(--f-body)}
.pc-f{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:end;border-top:1px solid var(--line);padding-top:6px}
.pc-f small{display:block;font-size:11px;color:var(--muted)}
.pc-f b{font-family:var(--f-mono);font-weight:500;font-size:18px;line-height:1.1}
.pc-f .spark{justify-self:end}
.strip{padding:6px 16px 4px}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.srow:first-of-type{border-top:0}
.sname{font-weight:500;line-height:1.2}
.sname small{display:block;color:var(--muted);font-weight:400;font-size:12px;font-family:var(--f-mono)}
.sax{border-top:0}
.strk{position:relative;margin:0 14px}
.strk .grid{position:absolute;inset:0;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20% 100%;border-right:1px solid var(--line)}
.sax .strk{height:16px}
.sax .strk span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sdot{position:absolute;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;padding:0;font-family:var(--f-display);font-weight:700;font-size:12px;line-height:20px;text-align:center;z-index:2}
.sdot:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.sdot.import{background:color-mix(in srgb,var(--accent) 55%,var(--surface));color:var(--ink)}
.sring{position:absolute;width:14px;height:14px;margin:3px 0 0 -7px;border-radius:50%;border:2px solid var(--target);background:var(--surface);z-index:1}
.sring.ok{border-color:var(--good)}
.sline{position:absolute;height:0;border-top:2px dashed var(--target);margin-top:-1px;z-index:0}
.sleg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 0;font-size:13px;color:var(--muted)}
.sleg b{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;font-family:var(--f-display);font-size:11px;margin-right:5px}
@media (max-width:640px){.srow{grid-template-columns:minmax(0,1fr)}}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:22px;margin-bottom:6px;text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="cockpit-format">
/* v406 (demandé : « le système de compétences doit reprendre le même format que le site ») : polices, couleurs, rayons et casse du Cockpit.
   Les couleurs sont posées par la page parente (SavSkills.js) sur <html> d'après le thème du site (clair / sombre) ; ci-dessous, le clair par défaut. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#E9EDF3; --ink:#101828; --muted:#52607A; --line:#DDE2EA;
  --accent:#076477; --accent-ink:#FFFFFF; --target:#8A5A00; --good:#1D7350; --warn:#8A5A00;
  --f-display:'Cabinet Grotesk',Satoshi,system-ui,sans-serif; --f-body:Satoshi,system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --r:8px;
}
body{font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
*{text-transform:none !important}
.brand h1{font-size:22px;letter-spacing:-.01em}
.brand h1::first-letter{text-transform:none}
.panel-h h2{font-size:16px;letter-spacing:0}
.mx .grp th,.grp-h{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:0}
.lvl-h h3{font-size:16px;letter-spacing:0}
.sk-cols{font-size:12px;letter-spacing:0}
.rcat-h b,.pc-h b{font-size:16px;letter-spacing:0}
.empty h2{font-size:20px}
.panel{border-radius:12px}
.cell{border-radius:4px}
.tabs{border-radius:8px}
.tabs button{border-radius:6px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.btn{border-radius:8px;font-weight:500;min-height:32px}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<div id="toast" class="toast" hidden></div>

<script>
/* v405 : dans le Cockpit BU ORC, la base et le compte viennent de la page parente (src/savSkills.js) ; ouverte seule, la page dit « Base indisponible ». */
window.claude = { use: async function (n) { try { var b = window.parent && window.parent !== window && window.parent.__enogiaSkills; return b ? await b(n) : null; } catch (e) { return null; } } };
</script>
<script>
(function(){
const PERIODS=['Q4-26','Q1-27','Q2-27','Q3-27','Q4-27','Q1-28'];
const CUR=(function(){const d=new Date();return 'Q'+(Math.floor(d.getMonth()/3)+1)+'-'+String(d.getFullYear()).slice(2)})();
const CI=Math.max(0,PERIODS.indexOf(CUR));
const STATE=['Non acquis','En cours ou avec aide','Autonome'];
const LVL_DEFAULT=['Découverte','Guidé','Autonome','Référent','Expert'];

let db=null, dbState='loading', err=null;
let people=[],cats=[],assess={},objs={},snaps={};
let selfDocs={},profNames={},linkFor=null,isAdmin=true,myUid=null,viewDoc=null,userNs=null,me=null;
const loaded={};
let tableOpen=false,view='team',pid=null,openCat=null,refOpen=null,confirmKey=null,freezeAsk=false,pendingFocus=null;
let horizon=PERIODS[Math.min(CI+1,PERIODS.length-1)];
try{const s=JSON.parse(localStorage.getItem('csav')||'{}'); if(s.view)view=s.view; if(s.pid)pid=s.pid;}catch(e){}
function persist(){try{localStorage.setItem('csav',JSON.stringify({view,pid}))}catch(e){}}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v==null?'–':(Number.isInteger(v)?String(v):v.toFixed(1)).replace('.',',');
const clone=o=>JSON.parse(JSON.stringify(o));
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const r2=x=>Math.round(x*2)/2;
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},3500)}

/* ---------- calculs ---------- */
function mgrOf(p){return (assess[p]&&assess[p].mgr)||{}}
function selfOf(p){const pp=people.find(x=>x.id===p);if(pp&&pp.uid)return (selfDocs[pp.uid]&&selfDocs[pp.uid].self)||{};return (assess[p]&&assess[p].self)||{}}
function rawScore(p,cat){
  const a=mgrOf(p);let full=0;
  for(const lv of cat.levels){
    const sk=lv.skills||[];
    if(!sk.length){full++;continue}
    const pr=sk.reduce((s,k)=>s+(a[k.id]||0),0)/(2*sk.length);
    if(pr>=1){full++;continue}
    return full+pr;
  }
  return full;
}
function hasData(p,cat){const a=mgrOf(p);return cat.levels.some(lv=>(lv.skills||[]).some(k=>k.id in a))}
function snapVal(p,period,catId){const s=snaps[p+'|'+period];return s&&s.scores&&s.scores[catId]!=null?s.scores[catId]:null}
function current(p,cat){
  if(hasData(p,cat))return{v:r2(rawScore(p,cat)),src:'live'};
  const v=snapVal(p,CUR,cat.id);
  return v!=null?{v:v,src:'import'}:{v:null,src:'none'};
}
function target(p,catId,period){const o=objs[p+'|'+(period||horizon)];return o&&o[catId]!=null?o[catId]:null}
function series(p,cat){return PERIODS.map((per,i)=>i<CI?snapVal(p,per,cat.id):i===CI?current(p,cat).v:null)}
function avgSeries(p){return PERIODS.map((per,i)=>{
  if(i>CI)return null;
  const vs=cats.map(c=>i<CI?snapVal(p,per,c.id):current(p,c).v).filter(v=>v!=null);
  return vs.length?mean(vs):null;})}

/* ---------- écriture ---------- */
const q={};
function save(path,data){
  q[path]=(q[path]||Promise.resolve()).then(()=>db.doc(path).set(data)).catch(e=>toast('Enregistrement impossible : '+((e&&e.message)||e)));
  return q[path];
}
function stripId(o){const c=clone(o);delete c.id;return c}
function setSkill(who,p,sid){
  const pp=people.find(x=>x.id===p);
  if(who==='mgr'&&!isAdmin)return;
  if(who==='self'&&pp&&pp.uid){
    if(isAdmin){toast('L’auto-évaluation est renseignée par la personne elle-même');return}
    const sd=selfDocs[pp.uid]?clone(selfDocs[pp.uid]):{uid:pp.uid};
    delete sd.id;sd.self=sd.self||{};sd.self[sid]=((sd.self[sid]||0)+1)%3;sd.updatedAt=Date.now();
    selfDocs[pp.uid]=Object.assign({id:pp.uid},sd);render();save('selfeval/'+pp.uid,sd);return;
  }
  const doc=assess[p]?clone(assess[p]):{personId:p};
  delete doc.id;doc.mgr=doc.mgr||{};doc.self=doc.self||{};
  doc[who][sid]=((doc[who][sid]||0)+1)%3;doc.updatedAt=Date.now();
  assess[p]=Object.assign({id:p},doc);render();save('assess/'+p,doc);
  if(who==='mgr')syncMirror(p);
}
function prefill(p,cat){
  if(!isAdmin)return;
  const base=snapVal(p,CUR,cat.id);if(base==null)return;
  const doc=assess[p]?clone(assess[p]):{personId:p};
  delete doc.id;doc.mgr=doc.mgr||{};doc.self=doc.self||{};
  let rem=base;
  cat.levels.forEach(lv=>{
    const n=lv.skills.length,f=Math.max(0,Math.min(1,rem)),k=f>=1?n:Math.floor(f*n);
    lv.skills.forEach((s,i)=>{doc.mgr[s.id]=i<k?2:0});rem-=1;
  });
  doc.updatedAt=Date.now();assess[p]=Object.assign({id:p},doc);render();save('assess/'+p,doc);syncMirror(p);
}
function stepTarget(p,catId,d){
  if(!isAdmin)return;
  const key=p+'|'+horizon,cat=cats.find(c=>c.id===catId);
  const doc=objs[key]?{personId:p,period:horizon,targets:clone(objs[key])}:{personId:p,period:horizon,targets:{}};
  const cur=doc.targets[catId];
  const base=cur!=null?cur:(current(p,cat).v||0);
  const nv=cur!=null?base+d:(d>0?base+0.5:base);
  if(nv<0||(cur==null&&d<0&&base===0)){delete doc.targets[catId]}
  else if(cur==null&&d<0){doc.targets[catId]=Math.max(0,r2(base-0.5))}
  else doc.targets[catId]=Math.min(5,r2(nv));
  doc.updatedAt=Date.now();objs[key]=doc.targets;render();save('objectives/'+p+'_'+horizon,doc);syncMirror(p);
}
function freeze(){
  people.forEach(p=>{
    const scores={};cats.forEach(c=>{const v=current(p.id,c).v;if(v!=null)scores[c.id]=v});
    const doc={personId:p.id,period:CUR,scores:scores,source:'figé',createdAt:Date.now()};
    snaps[p.id+'|'+CUR]=doc;save('snapshots/'+p.id+'_'+CUR,doc);
  });
  freezeAsk=false;render();syncAll();toast('Trimestre '+CUR+' figé pour toute l’équipe');
}
function saveCat(cat){cats=cats.map(c=>c.id===cat.id?cat:c);render();save('categories/'+cat.id,stripId(cat))}
function savePerson(p){people=people.map(x=>x.id===p.id?p:x);render();save('people/'+p.id,stripId(p));syncMirror(p.id)}
function syncMirror(pidv){
  const p=people.find(x=>x.id===pidv);if(!p||!p.uid||!isAdmin)return;
  const doc={personId:p.id,name:p.name,role:p.role||'',mgr:clone(mgrOf(p.id)),objectives:{},snapshots:{},updatedAt:Date.now()};
  PERIODS.forEach(per=>{const o=objs[p.id+'|'+per];if(o)doc.objectives[per]=clone(o);const sn=snaps[p.id+'|'+per];if(sn&&sn.scores)doc.snapshots[per]=clone(sn.scores)});
  save('view/'+p.uid,doc);
}
function syncAll(){people.forEach(p=>syncMirror(p.id))}
async function resolveNames(){
  if(!userNs||!isAdmin)return;
  const ids=people.map(p=>p.uid).filter(u=>u&&!profNames[u]);if(!ids.length)return;
  const ps=await userNs.profiles(ids);let ch=false;
  ids.forEach(i=>{if(ps[i]&&ps[i].name){profNames[i]=ps[i].name;ch=true}});
  if(ch)render();
}

/* ---------- visuels ---------- */
function spark(ser,tIdx,tVal){
  const W=140,H=34,px=i=>7+i*(W-14)/5,py=v=>H-6-(v/5)*(H-12);
  const pts=[];ser.forEach((v,i)=>{if(v!=null)pts.push([px(i),py(v)])});
  let s='<svg class="spark" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true">';
  for(let i=0;i<6;i++)s+='<line class="sk-tick" x1="'+px(i)+'" x2="'+px(i)+'" y1="'+(H-3)+'" y2="'+H+'"/>';
  if(pts.length>1)s+='<polyline class="sk-line" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';
  if(tVal!=null&&tIdx>=0){
    const last=pts[pts.length-1];
    if(last)s+='<line class="sk-tl" x1="'+last[0].toFixed(1)+'" y1="'+last[1].toFixed(1)+'" x2="'+px(tIdx).toFixed(1)+'" y2="'+py(tVal).toFixed(1)+'"/>';
    s+='<circle class="sk-tg" cx="'+px(tIdx).toFixed(1)+'" cy="'+py(tVal).toFixed(1)+'" r="3.2"/>';
  }
  pts.forEach((p,i)=>{s+='<circle class="sk-dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?3.4:2.2)+'"/>'});
  return s+'</svg>';
}
function radar(p){
  const n=cats.length;if(n<3)return '';
  const cx=210,cy=172,R=104;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/5,cy+Math.sin(ang(i))*R*v/5];
  const poly=f=>cats.map((c,i)=>{const q=pt(i,f(c));return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
  let s='<svg class="radar" viewBox="0 0 420 344" role="img" aria-label="Radar des niveaux">';
  for(let k=1;k<=5;k++)s+='<polygon class="rg" points="'+poly(()=>k)+'"/>';
  cats.forEach((c,i)=>{const q=pt(i,5);s+='<line class="rs" x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'"/>'});
  for(let k=1;k<=5;k++)s+='<text class="rn" x="'+(cx+4)+'" y="'+(cy-R*k/5+3)+'">'+k+'</text>';
  const hasT=cats.some(c=>target(p,c.id)!=null);
  if(hasT)s+='<polygon class="rtg" points="'+poly(c=>{const t=target(p,c.id);return t!=null?t:(current(p,c).v||0)})+'"/>';
  s+='<polygon class="rcur" points="'+poly(c=>current(p,c).v||0)+'"/>';
  cats.forEach((c,i)=>{const v=current(p,c).v;if(v!=null){const q=pt(i,v);s+='<circle class="rd" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.2"/>'}});
  cats.forEach((c,i)=>{
    const a=ang(i),x=cx+Math.cos(a)*(R+14),y=cy+Math.sin(a)*(R+14);
    const co=Math.cos(a),anchor=co>0.3?'start':co<-0.3?'end':'middle';
    const words=c.name.split(' ');let lines=[c.name];
    if(words.length>1&&c.name.length>13){const m=Math.ceil(words.length/2);lines=[words.slice(0,m).join(' '),words.slice(m).join(' ')]}
    const y0=y+(Math.sin(a)>0.5?10:Math.sin(a)<-0.5?-(lines.length-1)*13:-(lines.length-1)*6)+4;
    s+='<text text-anchor="'+anchor+'">'+lines.map((l,j)=>'<tspan x="'+x.toFixed(1)+'" y="'+(y0+j*13).toFixed(1)+'">'+esc(l)+'</tspan>').join('')+'</text>';
  });
  return s+'</svg>';
}

/* ---------- vues ---------- */
function header(){
  const ci=PERIODS.indexOf(CUR);
  const opts=PERIODS.slice(Math.min(ci+1,PERIODS.length-1));
  return '<header class="top"><div class="top-in"><div class="brand"><h1>'+(isAdmin?'Compétences SAV':'Mon suivi de compétences')+'</h1><p>Mise en service et après-vente · trimestre en cours <b>'+CUR+'</b></p></div>'+
  (!isAdmin?'':'<nav class="tabs" aria-label="Vues">'+[['team','Équipe'],['person','Fiche'],['ref','Référentiel']].map(t=>'<button data-act="view" data-v="'+t[0]+'" aria-selected="'+(view===t[0])+'">'+t[1]+'</button>').join('')+'</nav>')+
  (view!=='ref'?'<label class="hz">Objectif pour <select id="hz">'+opts.map(o=>'<option'+(o===horizon?' selected':'')+'>'+o+'</option>').join('')+'</select></label>':'')+
  '</div></header>';
}
function empty(){
  return '<div class="panel empty"><h2>Aucune donnée pour l’instant</h2><p>Ajoutez des collaborateurs et des catégories dans l’onglet Référentiel.</p></div>';
}
function matrixView(){
  if(!people.length||!cats.length)return empty();
  let h='<section class="panel"><div class="panel-h"><h2>Niveau par catégorie</h2><p class="hint">Échelle de 0 à 5. Cliquez sur un nom ou une case pour ouvrir la fiche.</p></div><div class="mx-scroll"><table class="mx"><thead><tr><th class="c0"></th>';
  people.forEach(p=>{h+='<th><button class="ph" data-act="openPerson" data-id="'+p.id+'">'+esc(p.name)+'</button></th>'});
  h+='<th class="avg">Équipe</th></tr></thead><tbody>';
  [['technique','Technique'],['transverse','Transverse']].forEach(g=>{
    const cs=cats.filter(c=>(c.kind||'technique')===g[0]);if(!cs.length)return;
    h+='<tr class="grp"><th colspan="'+(people.length+2)+'">'+g[1]+'</th></tr>';
    cs.forEach(c=>{
      const vals=[];h+='<tr><th class="c0" scope="row">'+esc(c.name)+'</th>';
      people.forEach(p=>{
        const cu=current(p.id,c),t=target(p.id,c.id);if(cu.v!=null)vals.push(cu.v);
        const tg=t==null?'':(cu.v!=null&&cu.v>=t?'<i class="ok">✓ '+fmt(t)+'</i>':'<i>→ '+fmt(t)+'</i>');
        h+='<td><button class="cell'+(cu.src==='import'?' imp':'')+'" style="--p:'+(cu.v==null?0:Math.round(cu.v/5*55))+'" data-act="openCell" data-id="'+p.id+'" data-cat="'+c.id+'" title="'+esc(p.name+' · '+c.name)+'"><b>'+fmt(cu.v)+'</b>'+tg+'</button></td>';
      });
      h+='<td class="avg"><b>'+fmt(mean(vals))+'</b></td></tr>';
    });
  });
  h+='</tbody><tfoot><tr><th class="c0" scope="row">Niveau moyen</th>';
  const all=[];
  people.forEach(p=>{const vs=cats.map(c=>current(p.id,c).v).filter(v=>v!=null);const m=mean(vs);if(m!=null)all.push(m);h+='<td class="avg"><b>'+fmt(m==null?null:Math.round(m*10)/10)+'</b></td>'});
  h+='<td class="avg"><b>'+fmt(all.length?Math.round(mean(all)*10)/10:null)+'</b></td></tr><tr><th class="c0" scope="row">Progression</th>';
  people.forEach(p=>{
    const tv=cats.map(c=>target(p.id,c.id)!=null?target(p.id,c.id):current(p.id,c).v).filter(v=>v!=null);
    const anyT=cats.some(c=>target(p.id,c.id)!=null);
    h+='<td>'+spark(avgSeries(p.id),PERIODS.indexOf(horizon),anyT?mean(tv):null)+'</td>';
  });
  h+='<td></td></tr></tfoot></table></div><div class="foot"><div class="legend"><span><i class="sw" style="background:color-mix(in srgb,var(--accent) 55%,var(--surface))"></i>niveau actuel</span><span style="color:var(--target)">→ objectif '+horizon+'</span><span><i class="sw" style="background:var(--warn)"></i>score importé du fichier Excel, à détailler par compétences</span></div>';
  h+='</div></section>';
  return h;
}

const SHORT={'c-fluidique':'Fluid.','c-electricite':'Élec.','c-automatisme':'Auto.','c-produit':'Produit','c-livrables':'Livrab.','c-rigueur':'Rigueur','c-client':'Client'};
function shortOf(c){return SHORT[c.id]||(c.name.length>8?c.name.slice(0,7)+'.':c.name)}
function catAvg(c){return mean(people.map(p=>current(p.id,c).v).filter(v=>v!=null))}
function miniRadar(p){
  const n=cats.length;if(n<3)return '';
  const cx=100,cy=96,R=58,ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/5,cy+Math.sin(ang(i))*R*v/5];
  const poly=f=>cats.map((c,i)=>{const q=pt(i,f(c));return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
  let s='<svg class="mr" viewBox="0 0 200 192" role="img" aria-label="Radar de '+esc(p.name)+'">';
  [1,3,5].forEach(k=>{s+='<polygon class="rg" points="'+poly(()=>k)+'"/>'});
  cats.forEach((c,i)=>{const q=pt(i,5);s+='<line class="rs" x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'"/>'});
  s+='<polygon class="ravg" points="'+poly(c=>catAvg(c)||0)+'"/>';
  if(cats.some(c=>target(p.id,c.id)!=null))s+='<polygon class="rtg" points="'+poly(c=>{const t=target(p.id,c.id);return t!=null?t:(current(p.id,c).v||0)})+'"/>';
  s+='<polygon class="rcur" points="'+poly(c=>current(p.id,c).v||0)+'"/>';
  cats.forEach((c,i)=>{
    const a=ang(i),x=cx+Math.cos(a)*(R+9),y=cy+Math.sin(a)*(R+9)+3,co=Math.cos(a);
    s+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+(co>0.3?'start':co<-0.3?'end':'middle')+'">'+esc(shortOf(c))+'</text>';
  });
  return s+'</svg>';
}
function overviewPanel(){
  let h='<section class="panel"><div class="panel-h"><h2>Vue d’ensemble</h2><p class="hint">Un radar par personne : niveau actuel en teal, objectif '+horizon+' en orange, moyenne de l’équipe en pointillé gris.</p></div><div class="ov">';
  people.forEach(p=>{
    const vs=cats.map(c=>current(p.id,c).v).filter(v=>v!=null),m=mean(vs);
    const tv=cats.map(c=>target(p.id,c.id)!=null?target(p.id,c.id):current(p.id,c).v).filter(v=>v!=null);
    const anyT=cats.some(c=>target(p.id,c.id)!=null);
    h+='<button class="pc" data-act="openPerson" data-id="'+p.id+'"><div class="pc-h"><b>'+esc(p.name)+'</b></div>'+miniRadar(p)+
      '<div class="pc-f"><div><small>Niveau moyen</small><b>'+fmt(m==null?null:Math.round(m*10)/10)+'</b></div><div><small>Objectif</small><b style="color:var(--target)">'+(anyT?fmt(Math.round(mean(tv)*10)/10):'–')+'</b></div>'+
      spark(avgSeries(p.id),PERIODS.indexOf(horizon),anyT?mean(tv):null)+'</div></button>';
  });
  h+='</div><div class="foot"><div class="legend"><span><i class="sw" style="background:var(--accent)"></i>niveau actuel</span><span style="color:var(--target)">- - objectif '+horizon+'</span><span>···· moyenne de l’équipe</span></div>';
  h+='<div class="freeze">'+(freezeAsk?'<span>Enregistrer les niveaux de '+CUR+' comme référence de progression ?</span><button class="btn pri sm" data-act="freezeOk">Figer</button><button class="btn sm" data-act="freezeNo">Annuler</button>':'<button class="btn" data-act="freezeAsk">Figer le trimestre '+CUR+'</button>')+'</div></div></section>';
  return h;
}
function stripPanel(){
  const LH=24;
  let h='<section class="panel"><div class="panel-h"><h2>Situation par catégorie</h2><p class="hint">Une pastille par personne (initiale du prénom). L’anneau est l’objectif '+horizon+' : orange à atteindre, vert déjà atteint.</p></div>';
  h+='<div class="sleg">'+people.map(p=>'<span><b>'+esc(p.name.trim().charAt(0).toUpperCase())+'</b>'+esc(p.name)+'</span>').join('')+'</div><div class="strip">';
  h+='<div class="srow sax"><span></span><div class="strk">'+[0,1,2,3,4,5].map(k=>'<span style="left:'+(k*20)+'%">'+k+'</span>').join('')+'</div></div>';
  [['technique','Technique'],['transverse','Transverse']].forEach(g=>{
    cats.filter(c=>(c.kind||'technique')===g[0]).forEach(c=>{
      const av=catAvg(c);
      h+='<div class="srow"><div class="sname">'+esc(c.name)+'<small>moy. '+fmt(av==null?null:Math.round(av*10)/10)+'</small></div><div class="strk" style="height:'+(people.length*LH)+'px"><div class="grid"></div>';
      people.forEach((p,i)=>{
        const cu=current(p.id,c),t=target(p.id,c.id),top=i*LH+2;
        if(cu.v==null)return;
        if(t!=null&&t>cu.v)h+='<div class="sline" style="left:'+(cu.v*20)+'%;width:'+((t-cu.v)*20)+'%;top:'+(top+10)+'px"></div>';
        if(t!=null)h+='<div class="sring'+(cu.v>=t?' ok':'')+'" style="left:'+(t*20)+'%;top:'+(top)+'px" title="Objectif '+fmt(t)+'"></div>';
        h+='<button class="sdot'+(cu.src==='import'?' import':'')+'" style="left:'+(cu.v*20)+'%;top:'+top+'px" data-act="openCell" data-id="'+p.id+'" data-cat="'+c.id+'" title="'+esc(p.name+' : '+fmt(cu.v))+'">'+esc(p.name.trim().charAt(0).toUpperCase())+'</button>';
      });
      h+='</div></div>';
    });
  });
  return h+'</div></section>';
}
function teamView(){
  if(!people.length||!cats.length)return empty();
  return overviewPanel()+stripPanel()+
    '<div><button class="btn" data-act="toggleTable" aria-expanded="'+tableOpen+'">'+(tableOpen?'Masquer le tableau détaillé':'Afficher le tableau détaillé')+'</button></div>'+(tableOpen?matrixView():'');
}
function personView(){
  if(!people.length||!cats.length)return empty();
  const p=people.find(x=>x.id===pid)||people[0];pid=p.id;
  let h=(!isAdmin?'':'<div class="tabs-p">'+people.map(x=>'<button class="pchip" data-act="person" data-id="'+x.id+'" aria-pressed="'+(x.id===p.id)+'"><span class="av">'+esc((x.name||'?').trim().charAt(0).toUpperCase())+'</span>'+esc(x.name)+'</button>').join('')+'</div>');
  const vals=cats.map(c=>current(p.id,c).v).filter(v=>v!=null);
  const tg=cats.filter(c=>target(p.id,c.id)!=null);
  let gaps=0,total=0,mast=0;
  cats.forEach(c=>c.levels.forEach(l=>l.skills.forEach(k=>{total++;const m=mgrOf(p.id)[k.id],s=selfOf(p.id)[k.id];if(m===2)mast++;if(m!=null&&s!=null&&m!==s)gaps++})));
  h+='<div class="fiche"><section class="panel"><div class="panel-h"><h2>'+esc(p.name)+'</h2><p class="hint">'+esc(p.role||'')+'</p></div><div class="radar-wrap">'+radar(p.id)+'</div>'+
   '<div class="stats"><div class="stat"><span>Niveau moyen</span><b>'+fmt(vals.length?Math.round(mean(vals)*10)/10:null)+'</b></div>'+
   '<div class="stat"><span>Objectif '+horizon+'</span><b style="color:var(--target)">'+(tg.length?fmt(Math.round(mean(tg.map(c=>target(p.id,c.id)))*10)/10):'–')+'</b></div>'+
   '<div class="stat"><span>Compétences autonomes</span><b>'+mast+'/'+total+'</b></div></div>'+
   '<div class="foot"><div class="legend"><span><i class="sw" style="background:var(--accent)"></i>actuel</span><span style="color:var(--target)">- - objectif '+horizon+'</span>'+(gaps?'<span>'+gaps+' écart'+(gaps>1?'s':'')+' entre auto-évaluation et manager</span>':'')+'</div></div></section>';
  h+='<section class="panel"><div class="panel-h"><h2>Catégories</h2><p class="hint">Ouvrez une catégorie pour situer le niveau, compétence par compétence.</p></div><div style="margin-top:10px">';
  [['technique','Technique'],['transverse','Transverse']].forEach(g=>{
    const cs=cats.filter(c=>(c.kind||'technique')===g[0]);if(!cs.length)return;
    h+='<h3 class="grp-h">'+g[1]+'</h3>';
    cs.forEach(c=>{h+=catRow(p,c)});
  });
  return h+'</div></section></div>';
}
function catRow(p,c){
  const cu=current(p.id,c),t=target(p.id,c.id),open=openCat===c.id;
  const ser=series(p.id,c);
  let h='<article class="crow'+(open?' open':'')+'"><div class="crow-h"><button class="cmain" data-act="cat" data-id="'+c.id+'" aria-expanded="'+open+'"><span class="cname">'+esc(c.name)+'</span>'+
   '<span class="ladder" aria-hidden="true"><span class="lf" style="width:'+((cu.v||0)/5*100)+'%"></span>'+(t!=null?'<span class="lt" style="left:'+(t/5*100)+'%"></span>':'')+'</span>'+
   '<span class="cval">'+fmt(cu.v)+(cu.src==='import'?'<small>importé</small>':'')+'</span></button>'+
   '<div class="tgt" title="Objectif pour '+horizon+'">'+(isAdmin?'<button data-act="tgt" data-cat="'+c.id+'" data-d="-0.5" aria-label="Baisser l’objectif">−</button>':'<span>Objectif</span>')+'<span class="tv">'+(t!=null?fmt(t):'–')+'</span>'+(isAdmin?'<button data-act="tgt" data-cat="'+c.id+'" data-d="0.5" aria-label="Monter l’objectif">+</button>':'')+'</div>'+
   '<div class="spk">'+spark(ser,PERIODS.indexOf(horizon),t)+'</div></div>';
  if(open)h+=detail(p,c,t);
  return h+'</article>';
}
function detail(p,c,t){
  const m=mgrOf(p.id),s=selfOf(p.id),base=snapVal(p.id,CUR,c.id);
  let h='<div class="detail">';
  if(isAdmin&&!hasData(p.id,c)&&base!=null)h+='<div class="banner"><span>Niveau importé du fichier Excel : <b class="mono">'+fmt(base)+'</b>. Les compétences ne sont pas encore détaillées.</span><button class="btn sm" data-act="prefill" data-cat="'+c.id+'">Pré-remplir les compétences depuis ce score</button></div>';
  h+='<div class="sk-cols"><span style="text-align:left">Compétence</span><span>Auto</span><span>Manager</span></div>';
  c.levels.forEach((lv,i)=>{
    const sk=lv.skills||[],ok=sk.filter(k=>m[k.id]===2).length,done=sk.length&&ok===sk.length;
    h+='<div class="lvl'+(done?' done':'')+'"><div class="lvl-h"><h3><span>N'+(i+1)+'</span>'+esc(lv.label)+'</h3><span class="prog">'+(done?'validé · ':'')+ok+'/'+sk.length+' en autonomie</span></div>';
    sk.forEach(k=>{
      const mv=m[k.id]||0,sv=s[k.id]||0,need=t!=null&&i<Math.ceil(t)&&mv<2;
      h+='<div class="sk'+(need?' need':'')+'"><div class="st">'+esc(k.text||'(compétence à décrire)')+(need?'<small>objectif '+horizon+'</small>':'')+'</div>'+
       '<button class="dot self d'+sv+'" data-act="cycle" data-who="self" data-sid="'+k.id+'"'+(isAdmin&&p.uid?' disabled':'')+' title="Auto-évaluation : '+STATE[sv]+'" aria-label="Auto-évaluation : '+STATE[sv]+'"></button>'+
       '<button class="dot d'+mv+'" data-act="cycle" data-who="mgr" data-sid="'+k.id+'"'+(isAdmin?'':' disabled')+' title="Manager : '+STATE[mv]+'" aria-label="Manager : '+STATE[mv]+'"></button></div>';
    });
    if(!sk.length)h+='<p class="hint" style="padding:6px 0">Aucune compétence décrite pour ce niveau.</p>';
    h+='</div>';
  });
  return h+(!isAdmin?'<p class="hint" style="margin-top:12px">Situez-vous avec la pastille Auto : vide = non acquis, demi = en cours ou avec aide, plein = autonome. La pastille Manager est renseignée par votre manager.</p></div>':'<p class="hint" style="margin-top:12px">Un clic fait passer une compétence de vide (non acquis) à demi-plein (en cours ou avec aide) puis plein (autonome). Le niveau de la catégorie monte quand toutes les compétences d’un niveau sont en autonomie. L’auto-évaluation des personnes dont le compte est relié est renseignée par elles.</p></div>');
}
function refView(){
  let h='<section class="panel"><div class="panel-h"><h2>Équipe</h2><p class="hint">Les personnes suivies dans cet outil.</p></div><div class="ref-grid">';
  people.forEach(p=>{
    const ck='p:'+p.id;
    h+='<div class="pcard"><div class="prow"><input type="text" id="pn-'+p.id+'" value="'+esc(p.name)+'" data-edit="pname" data-id="'+p.id+'" aria-label="Nom"><input type="text" id="pr-'+p.id+'" value="'+esc(p.role||'')+'" data-edit="prole" data-id="'+p.id+'" aria-label="Fonction" placeholder="Fonction"><button class="btn sm'+(confirmKey===ck?' dng':'')+'" data-act="delPerson" data-id="'+p.id+'">'+(confirmKey===ck?'Confirmer':'Retirer')+'</button></div>';
    h+='<div class="plink">'+(p.uid?'<span class="ok">Compte Enogia relié : <b>'+esc(profNames[p.uid]||'…')+'</b></span><button class="btn sm" data-act="unlink" data-id="'+p.id+'">Délier</button>':(linkFor===p.id?'<input type="text" id="lk-in" placeholder="Rechercher un collègue par nom" autocomplete="off" aria-label="Rechercher un collègue"><div id="lk-res" class="lk-res"></div><button class="btn sm" data-act="linkCancel">Annuler</button>':'<span>Aucun compte relié : cette personne ne voit pas encore son suivi.</span><button class="btn sm" data-act="linkStart" data-id="'+p.id+'">Relier un compte Enogia</button>'))+'</div></div>';
  });
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" data-act="addPerson">Ajouter une personne</button><button class="btn" data-act="syncAll">Mettre à jour les accès</button></div><p class="hint">Une personne reliée voit uniquement sa fiche (niveaux, objectifs, historique) et renseigne son auto-évaluation. Les autres données restent invisibles pour elle.</p></div></section>';
  h+='<section class="panel"><div class="panel-h"><h2>Catégories et niveaux</h2><p class="hint">Trame de départ à adapter à vos machines et à vos pratiques. Chaque niveau regroupe les compétences qui le définissent.</p></div><div style="margin-top:10px">';
  cats.forEach(c=>{
    const open=refOpen===c.id,n=c.levels.reduce((s,l)=>s+l.skills.length,0);
    h+='<div class="rcat"><button class="rcat-h" data-act="refOpen" data-id="'+c.id+'" aria-expanded="'+open+'"><b>'+esc(c.name)+'</b><span>'+n+' compétences</span></button>';
    if(open){
      const ck='c:'+c.id;
      h+='<div class="rbody"><div class="rmeta"><input type="text" id="cn-'+c.id+'" value="'+esc(c.name)+'" data-edit="cname" data-cat="'+c.id+'" aria-label="Nom de la catégorie"><select class="sel" id="ck-'+c.id+'" data-edit="ckind" data-cat="'+c.id+'" aria-label="Type"><option value="technique"'+((c.kind||'technique')==='technique'?' selected':'')+'>Technique</option><option value="transverse"'+(c.kind==='transverse'?' selected':'')+'>Transverse</option></select><button class="btn sm'+(confirmKey===ck?' dng':'')+'" data-act="delCat" data-cat="'+c.id+'">'+(confirmKey===ck?'Confirmer la suppression':'Supprimer')+'</button></div>';
      c.levels.forEach((lv,i)=>{
        h+='<div class="rlvl"><div class="rlvl-h"><span>N'+(i+1)+'</span><input type="text" id="cl-'+c.id+'-'+i+'" value="'+esc(lv.label)+'" data-edit="lvl" data-cat="'+c.id+'" data-i="'+i+'" aria-label="Intitulé du niveau '+(i+1)+'"></div>';
        lv.skills.forEach(k=>{
          const sk='s:'+k.id;
          h+='<div class="rsk"><input type="text" id="sk-'+k.id+'" value="'+esc(k.text)+'" data-edit="skill" data-cat="'+c.id+'" data-i="'+i+'" data-sid="'+k.id+'" aria-label="Compétence" placeholder="Savoir… ou Maîtriser…"><button class="btn sm'+(confirmKey===sk?' dng':'')+'" data-act="delSkill" data-cat="'+c.id+'" data-i="'+i+'" data-sid="'+k.id+'">'+(confirmKey===sk?'Confirmer':'Retirer')+'</button></div>';
        });
        h+='<div class="rsk"><div><button class="btn sm" data-act="addSkill" data-cat="'+c.id+'" data-i="'+i+'">Ajouter une compétence</button></div></div></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h+'<div class="ref-grid"><div><button class="btn" data-act="addCat">Ajouter une catégorie</button></div></div></div></section>';
}

function render(){
  const root=document.getElementById('app');
  if(dbState==='none'){root.innerHTML='<div class="empty" style="padding-top:80px"><h2>Base indisponible</h2><p>Cette page a besoin de sa base de données. Ouvrez-la depuis votre compte Claude avec les droits d’édition.</p></div>';return}
  if(dbState==='loading'||!(isAdmin?['people','categories','assess','objectives','snapshots','selfeval']:['categories','view','selfeval']).every(k=>loaded[k]))return;
  if(err){root.innerHTML='<div class="empty" style="padding-top:80px"><h2>Lecture impossible</h2><p>'+esc(err.message||err.code||'Erreur')+'</p></div>';return}
  if(!isAdmin&&!viewDoc){root.innerHTML='<div class="empty" style="padding-top:80px"><h2>Suivi non activé</h2><p>Votre compte n’est pas encore relié à un profil de suivi. Demandez à votre manager de le relier.</p></div>';return}
  root.innerHTML=header()+'<main>'+(view==='team'?teamView():view==='person'?personView():refView())+'</main>';
  if(linkFor){const li=document.getElementById('lk-in');if(li&&document.activeElement!==li)li.focus()}
  if(pendingFocus){const el=document.getElementById('sk-'+pendingFocus);if(el)el.focus();pendingFocus=null}
  resolveNames();
}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  if(a==='view'){view=d.v;confirmKey=null;persist()}
  else if(a==='openPerson'){pid=d.id;view='person';openCat=null;persist();window.scrollTo(0,0)}
  else if(a==='openCell'){pid=d.id;view='person';openCat=d.cat;persist();window.scrollTo(0,0)}
  else if(a==='person'){pid=d.id;openCat=null;persist()}
  else if(a==='cat'){openCat=openCat===d.id?null:d.id}
  else if(a==='cycle'){setSkill(d.who,pid,d.sid);return}
  else if(a==='prefill'){prefill(pid,cats.find(c=>c.id===d.cat));return}
  else if(a==='tgt'){stepTarget(pid,d.cat,parseFloat(d.d));return}
  else if(a==='freezeAsk'){freezeAsk=true}
  else if(a==='freezeNo'){freezeAsk=false}
  else if(a==='freezeOk'){freeze();return}
  else if(a==='refOpen'){refOpen=refOpen===d.id?null:d.id}
  else if(a==='toggleTable'){tableOpen=!tableOpen}
  else if(a==='linkStart'){linkFor=d.id}
  else if(a==='linkCancel'){linkFor=null}
  else if(a==='pickUid'){
    const p=clone(people.find(x=>x.id===linkFor));
    if(people.some(x=>x.uid===d.uid&&x.id!==p.id)){toast('Ce compte est déjà relié à une autre personne');return}
    p.uid=d.uid;profNames[d.uid]=d.name;linkFor=null;savePerson(p);return;
  }
  else if(a==='unlink'){
    const p=clone(people.find(x=>x.id===d.id));const old=p.uid;delete p.uid;
    if(old)db.doc('view/'+old).delete().catch(()=>{});
    savePerson(p);return;
  }
  else if(a==='syncAll'){syncAll();toast('Accès mis à jour')}
  else if(a==='addPerson'){
    const p={id:'p-'+uid(),name:'Nouveau collaborateur',role:'SAV / Mise en service',order:people.reduce((m,x)=>Math.max(m,x.order||0),0)+1};
    people.push(p);pid=p.id;save('people/'+p.id,stripId(p));
  }
  else if(a==='delPerson'){
    const k='p:'+d.id;
    if(confirmKey!==k){confirmKey=k}
    else{confirmKey=null;people=people.filter(x=>x.id!==d.id);db.doc('people/'+d.id).delete().catch(()=>{});db.doc('assess/'+d.id).delete().catch(()=>{})}
  }
  else if(a==='addCat'){
    const c={id:'c-'+uid(),name:'Nouvelle catégorie',kind:'technique',order:cats.reduce((m,x)=>Math.max(m,x.order||0),0)+1,levels:LVL_DEFAULT.map(l=>({label:l,skills:[]}))};
    cats.push(c);refOpen=c.id;save('categories/'+c.id,stripId(c));
  }
  else if(a==='delCat'){
    const k='c:'+d.cat;
    if(confirmKey!==k){confirmKey=k}
    else{confirmKey=null;cats=cats.filter(x=>x.id!==d.cat);db.doc('categories/'+d.cat).delete().catch(()=>{})}
  }
  else if(a==='addSkill'){
    const c=clone(cats.find(x=>x.id===d.cat)),sid='s'+uid();
    c.levels[+d.i].skills.push({id:sid,text:''});pendingFocus=sid;saveCat(c);return;
  }
  else if(a==='delSkill'){
    const k='s:'+d.sid;
    if(confirmKey!==k){confirmKey=k}
    else{confirmKey=null;const c=clone(cats.find(x=>x.id===d.cat));c.levels[+d.i].skills=c.levels[+d.i].skills.filter(s=>s.id!==d.sid);saveCat(c);return}
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='hz'){horizon=t.value;render();return}
  const k=t.dataset&&t.dataset.edit;if(!k)return;
  const d=t.dataset;
  if(k==='pname'||k==='prole'){const p=clone(people.find(x=>x.id===d.id));if(k==='pname')p.name=t.value.trim()||p.name;else p.role=t.value.trim();savePerson(p);return}
  const c=clone(cats.find(x=>x.id===d.cat));if(!c)return;
  if(k==='cname')c.name=t.value.trim()||c.name;
  else if(k==='ckind')c.kind=t.value;
  else if(k==='lvl')c.levels[+d.i].label=t.value.trim()||c.levels[+d.i].label;
  else if(k==='skill'){const s=c.levels[+d.i].skills.find(x=>x.id===d.sid);if(s)s.text=t.value.trim()}
  saveCat(c);
});

/* ---------- recherche d'un compte ---------- */
document.addEventListener('input',async e=>{
  if(e.target.id!=='lk-in')return;
  const v=e.target.value.trim(),box=document.getElementById('lk-res');if(!box)return;
  if(!userNs||v.length<2){box.innerHTML='';return}
  const hits=await userNs.search(v);
  box.innerHTML=hits.length?hits.map(h=>'<button class="btn sm" data-act="pickUid" data-uid="'+esc(h.id)+'" data-name="'+esc(h.name)+'">'+esc(h.name)+'</button>').join(''):'<span class="hint">Aucun résultat</span>';
});

/* ---------- démarrage ---------- */
function listen(name,apply){
  db.collection(name).onSnapshot(function(sn){
    apply(sn.docs.map(function(d){return Object.assign({id:d.id},d.data())}));
    loaded[name]=true;render();
  },function(e){err=e;render()});
}
function listenDoc(path,key,apply){
  db.doc(path).onSnapshot(function(sn){
    apply(sn.exists?Object.assign({id:sn.id},sn.data()):null);
    loaded[key]=true;render();
  },function(e){err=e;render()});
}
function rebuildMe(){
  people=[];assess={};objs={};snaps={};
  if(!viewDoc)return;
  people=[{id:'me',uid:myUid,name:viewDoc.name,role:viewDoc.role}];
  assess={me:{id:'me',mgr:viewDoc.mgr||{},self:{}}};
  Object.keys(viewDoc.objectives||{}).forEach(per=>{objs['me|'+per]=viewDoc.objectives[per]});
  Object.keys(viewDoc.snapshots||{}).forEach(per=>{snaps['me|'+per]={scores:viewDoc.snapshots[per]}});
}
async function boot(){
  const d=await claude.use('db');
  if(!d){dbState='none';render();return}
  db=d;userNs=await claude.use('user');
  let admin=true;
  if(userNs){try{me=await userNs.me();admin=!!(me.canEdit||me.isOwner);myUid=me.id}catch(e){}}
  isAdmin=admin;dbState='ok';
  if(isAdmin){
    listen('people',a=>{people=a.sort((x,y)=>(x.order||0)-(y.order||0))});
    listen('categories',a=>{cats=a.sort((x,y)=>(x.order||0)-(y.order||0))});
    listen('assess',a=>{assess={};a.forEach(x=>{assess[x.id]=x})});
    listen('objectives',a=>{objs={};a.forEach(x=>{objs[x.personId+'|'+x.period]=x.targets||{}})});
    listen('snapshots',a=>{snaps={};a.forEach(x=>{snaps[x.personId+'|'+x.period]=x})});
    listen('selfeval',a=>{selfDocs={};a.forEach(x=>{selfDocs[x.id]=x})});
  }else{
    view='person';pid='me';
    listen('categories',a=>{cats=a.sort((x,y)=>(x.order||0)-(y.order||0))});
    if(!myUid){loaded.view=true;loaded.selfeval=true;render();return}
    listenDoc('view/'+myUid,'view',v=>{viewDoc=v;rebuildMe()});
    listenDoc('selfeval/'+myUid,'selfeval',v=>{selfDocs={};if(v)selfDocs[myUid]=v});
  }
}
boot().catch(function(){dbState='none';render()});
})();
</script>
