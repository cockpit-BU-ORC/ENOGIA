<style>
/* Layout : bandeau de chiffres, liste "à traiter", puis onglets Jalons (tableau unique, colonnes masquables), Cash par mois, Écarts (graphiques) et Projets. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#F7F9FB; --ink:#1F2F3D; --ink-2:#526373; --ink-3:#8190A0;
  --line:#DCE3E9; --line-2:#E9EEF2; --accent:#2C7DA0; --accent-ink:#FFFFFF; --accent-soft:#E3F0F6;
  --paid:#2E8B5E; --paid-bg:#E6F5EC; --invoiced:#2F6FB8; --invoiced-bg:#E4EEFA;
  --chased:#9A6A00; --chased-bg:#FDF3D8; --late:#C0392B; --late-bg:#FBE6E3;
  --tobill:#7A52AE; --tobill-bg:#F0E8F8; --future:#627385; --future-bg:#EDF1F4;
  --warn-bg:#FFF4D6; --warn-line:#E8B93C;
  --div-pos:#C96A1E; --div-neg:#3A78B8; --on-late:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1720; --surface:#17212C; --surface-2:#1C2835; --ink:#E6EDF3; --ink-2:#A9B7C4; --ink-3:#7F8E9C;
    --line:#2B3947; --line-2:#223040; --accent:#5CB3D6; --accent-ink:#0B1620; --accent-soft:#1B3445;
    --paid:#5FD08F; --paid-bg:#173626; --invoiced:#7FB2F0; --invoiced-bg:#172B47;
    --chased:#E7B94A; --chased-bg:#3B2F10; --late:#FF8A80; --late-bg:#471D1A;
    --tobill:#C5A3F0; --tobill-bg:#2D2142; --future:#9AA9B7; --future-bg:#232F3B;
    --warn-bg:#3B2F10; --warn-line:#E7B94A; --div-pos:#F0A056; --div-neg:#6FA8E0; --on-late:#2A0F0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#17212C; --surface-2:#1C2835; --ink:#E6EDF3; --ink-2:#A9B7C4; --ink-3:#7F8E9C;
  --line:#2B3947; --line-2:#223040; --accent:#5CB3D6; --accent-ink:#0B1620; --accent-soft:#1B3445;
  --paid:#5FD08F; --paid-bg:#173626; --invoiced:#7FB2F0; --invoiced-bg:#172B47;
  --chased:#E7B94A; --chased-bg:#3B2F10; --late:#FF8A80; --late-bg:#471D1A;
  --tobill:#C5A3F0; --tobill-bg:#2D2142; --future:#9AA9B7; --future-bg:#232F3B;
  --warn-bg:#3B2F10; --warn-line:#E7B94A; --div-pos:#F0A056; --div-neg:#6FA8E0; --on-late:#2A0F0D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;padding-inline:16px;padding-block:20px 72px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,.num-lg{font-family:'Barlow Semi Condensed','Barlow',system-ui,sans-serif}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.sub{color:var(--ink-2);margin-top:4px}
.actions-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.save{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.save.ok i{background:var(--paid)} .save.dirty i,.save.saving i{background:var(--chased)} .save.error i,.save.off i{background:var(--late)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;font-weight:500;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,.mini:focus-visible,.tab:focus-visible,.chip:focus-visible,.alert:focus-visible,summary:focus-visible,.seg button:focus-visible,.mrow:focus-visible,.drow:focus-visible,.addbtn:focus-visible,.sel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:30px;font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-family:'Barlow Semi Condensed','Barlow',sans-serif}
.kpi .note{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kpi.paid .val{color:var(--paid)}
.kpi .late-t{color:var(--late);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h2{margin:0 0 10px;font-size:18px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.panel h2 span{font-family:'Barlow',sans-serif;font-size:13px;color:var(--ink-3);font-weight:400}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.phead h2{margin:0}
.hz{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--ink-2);font-size:13px}
.hl{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.hzs{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center}
.hsum{display:flex;gap:20px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin:0 0 10px}
.hsum b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
.alert{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;cursor:pointer;min-width:0}
.alert:hover{border-color:var(--ink-3)}
.alert .pj{font-weight:600;font-size:12px;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);flex:none}
.alert .txt{min-width:0;flex:1}
.alert .txt b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert .txt span{font-size:12.5px;color:var(--ink-2)}
.alert .txt span.bad{color:var(--late);font-weight:600}
.alert .amt{font-variant-numeric:tabular-nums;font-weight:500;flex:none}
.ok-line{color:var(--ink-2)}
.kind{display:inline-block;font-size:11px;font-weight:600;font-style:normal;padding:1px 7px;border-radius:4px;margin-right:6px;background:var(--pbg);color:var(--pfg)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 16px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hint{margin:0;color:var(--ink-2);max-width:90ch;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:200px;flex:0 1 260px}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink-2);cursor:pointer}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--ink-2);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.lbl{font-size:12px;color:var(--ink-3);margin-right:6px}
details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:270px;max-height:70vh;overflow:auto;box-shadow:0 8px 24px rgba(10,20,30,.18)}
.cg{display:flex;flex-direction:column;gap:3px;padding-block:6px;border-bottom:1px solid var(--line-2)}
.cg label{display:flex;gap:7px;align-items:center;cursor:pointer}
.cg .ci{padding-left:22px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:8px 0 0;font-weight:600}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
td{padding:2px 3px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tablewrap table.auto{table-layout:auto;width:100%}
td.fit{width:1%;white-space:nowrap}
.in.date{cursor:pointer}
.in.date[readonly]{cursor:default}
.in.date::-webkit-calendar-picker-indicator{opacity:.75;cursor:pointer;padding:2px;margin-left:2px}
.in.date::-webkit-calendar-picker-indicator:hover{opacity:1}
.in.date[readonly]::-webkit-calendar-picker-indicator{display:none}
.mxwrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;margin-top:6px}
table.mx{border-collapse:separate;border-spacing:0;table-layout:auto}
table.mx th,table.mx td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--line-2);border-left:1px solid var(--line-2);min-width:58px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.mx thead th{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);text-transform:capitalize}
table.mx .mxp{position:sticky;left:0;z-index:2;background:var(--surface);min-width:76px;text-align:left;border-left:0;font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:14px;font-weight:600;padding-left:8px}
table.mx thead .mxp{background:var(--surface-2)}
table.mx th.cur{background:var(--accent);color:var(--accent-ink)}
table.mx td.cur{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
table.mx .tot{font-weight:600;background:var(--surface-2);min-width:70px}
td.mxc{cursor:pointer;font-weight:500}
td.mxc.p{background:var(--paid-bg);color:var(--paid)}
td.mxc.f{background:var(--invoiced-bg);color:var(--invoiced)}
td.mxc:hover{outline:2px solid var(--accent);outline-offset:-2px}
td.mxc sup{font-size:9px;margin-left:2px;opacity:.8}
td.tt{font-weight:700}
tr.mxt th,tr.mxt td{border-top:1px solid var(--line)}
tr.mxt th{background:var(--surface-2)}
td.ctr{text-align:center}
td.ctr input{cursor:pointer;width:15px;height:15px;accent-color:var(--accent)}
tr.row.epc td{background:var(--surface-2);color:var(--ink-3)}
tr.row.epc .in{color:var(--ink-3)}
tr.row.epc td:not(:first-child){opacity:.75}
.st-epc{--st:var(--line)}
.k-epc{--pbg:var(--future-bg);--pfg:var(--ink-3)}
.cmbtn{display:block;width:170px;text-align:left;border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px;cursor:pointer;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmbtn:hover{border-color:var(--line);background:var(--surface)}
.cmbtn.has{color:var(--ink)}
.cmbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ecl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:4px 0 12px}
.ecl div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;font-size:12.5px;color:var(--ink-2)}
.ecl b{display:block;font-size:17px;font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-variant-numeric:tabular-nums}
.ecl .bad{color:var(--late)} .ecl .good{color:var(--paid)} .ecl .zero{color:var(--ink-3)}
.cmtext{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px;font:inherit;color:var(--ink)}
.cmtext:focus{outline:2px solid var(--accent);outline-offset:0}
.tablewrap table td+td{border-left:1px solid var(--line-2)}
.tablewrap table td.gs{border-left:2px solid var(--line)}
.tablewrap table td.gb{border-left:4px solid var(--ink-3)}
td.sticky{position:sticky;left:0;z-index:2;background:var(--surface)}
tr.row td:first-child{border-left:3px solid var(--st,var(--line))}
.st-paid{--st:var(--paid)} .st-invoiced{--st:var(--invoiced)} .st-chased{--st:var(--chased)} .st-late{--st:var(--late)} .st-tobill{--st:var(--tobill)} .st-future{--st:var(--line)}
tr.row.st-paid td{color:var(--ink-2)}
tr.row:hover td,tr.row:hover td.sticky{background:var(--surface-2)}
tr.flash td{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.flash td{animation:none;background:var(--accent-soft)}}
.in{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px;min-width:0;color:inherit}
.in:hover{border-color:var(--line)}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft)}
.in.n{text-align:right;font-variant-numeric:tabular-nums}
.in.date{font-variant-numeric:tabular-nums;padding-inline:3px;font-size:13px}
table.auto td:first-child .in[data-f="jalon"]{min-width:120px}
.in.empty{color:var(--ink-3);opacity:.5}
.in.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px}
.in.date.soon{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink);opacity:1}
.in.date.urgent{background:var(--late-bg);border-color:var(--late);color:var(--ink);opacity:1}
.in.date.over{background:var(--late);border-color:var(--late);color:var(--on-late);opacity:1;font-weight:700}
.in.pjname{font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:20px;font-weight:600;width:120px;padding-block:2px}
.btn.gear{display:inline-flex;align-items:center;padding:7px 9px}
.in.pjowner,#ownerSel{width:auto;max-width:170px;padding-block:3px;font-size:13px}
.owrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.owrow b{min-width:70px}.owrow span.lb{flex:1;color:var(--ink-2);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in.pjlabel{width:min(230px,100%);font-style:italic;color:var(--ink-2);padding-block:3px}
.in.pjlabel::placeholder{color:var(--ink-3)}
.in.totin{width:120px;font-weight:600;padding-block:3px}
.tot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-style:italic}
.d,.ro{text-align:right;font-variant-numeric:tabular-nums;padding-inline:8px;white-space:nowrap}
.d{font-weight:600}
.ro{color:var(--ink-2)}
.d.bad{color:var(--late)} .d.good{color:var(--paid)} .d.zero{color:var(--ink-3);font-weight:400}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--pbg);color:var(--pfg);white-space:nowrap}
.k-paid{--pbg:var(--paid-bg);--pfg:var(--paid)} .k-invoiced{--pbg:var(--invoiced-bg);--pfg:var(--invoiced)} .k-chased{--pbg:var(--chased-bg);--pfg:var(--chased)} .k-late{--pbg:var(--late-bg);--pfg:var(--late)} .k-tobill{--pbg:var(--tobill-bg);--pfg:var(--tobill)} .k-future{--pbg:var(--future-bg);--pfg:var(--future)}
.sel{border:1px solid transparent;border-radius:999px;padding:4px 8px;font-weight:600;font-size:13px;background:var(--pbg);color:var(--pfg);cursor:pointer;max-width:100%}
.sel:hover{border-color:var(--pfg)}
.sel option{background:var(--surface);color:var(--ink);font-weight:400}
.jw{display:flex;align-items:center;gap:2px;min-width:0}
.jw .in{flex:1;min-width:0}
.dh{cursor:grab;color:var(--ink-3);font-size:14px;line-height:1;padding:4px 2px;user-select:none;flex:none;opacity:.55}
tr.row:hover .dh{opacity:1}
.dh:active{cursor:grabbing}
tr.row.dragging{opacity:.4}
tr.grp.dropt td,tr.addtr.dropt td{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
tr.row.dropt td{box-shadow:inset 0 3px 0 var(--accent)}
.msum{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.msum>div:not(.eq){flex:1 1 150px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 14px;min-width:0}
.msum span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.msum b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;font-family:'Barlow Semi Condensed','Barlow',sans-serif;line-height:1.2;margin-top:2px}
.msum i{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.msum .eq{align-self:center;font-size:22px;color:var(--ink-3);flex:none}
.msum .split{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:12.5px}
.msum u{text-decoration:none;font-weight:600}
.msum u.p{color:var(--paid)}.msum u.f{color:var(--invoiced)}
.msum .dlt.up b{color:var(--paid)}.msum .dlt.dn b{color:var(--late)}
.mrow.ygrp{background:var(--surface-2)}
.mrow.ygrp .m{font-weight:600}
.mrow.ygrp em{font-style:normal;font-weight:400;font-size:12px;color:var(--ink-3);margin-left:6px}
.chv{display:inline-block;width:14px;color:var(--ink-3)}
.cz{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:0 0 14px}
.czh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.czh b{color:var(--ink)}
.czr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.czs{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:500;padding:6px 8px}
.czd{width:70px;text-align:right}
.czf{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:4px}
.czt{font-size:12.5px;color:var(--ink-2)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 8px;font-size:12px;font-weight:500;cursor:pointer;line-height:1.5}

function punctual(r){
  var ref=r.encInit||r.encInitOld;
  if(r.epc||!r.montant||!ref)return null;
  var paid=status(r).k==='paid'&&!!r.encReelle,eff=paid?r.encReelle:r.encPrevue;
  if(!eff)return null;
  var d=diff(ref,eff);

  return {k:d>0?'shift':'ontime',d:d,paid:paid};
}
function monthKeys(r){

function monthly(){
  var M={},nodate={init:0,fc:0};
  var get=function(k){return M[k]||(M[k]={key:k,init:0,paid:0,fc:0,ot:0,sh:0,otN:0,shN:0})};
  rows.forEach(function(r){
    var mk=monthKeys(r);if(!mk)return;var a=r.montant;

    if(mk.act==='none')nodate.fc+=a;else if(mk.paid)get(mk.act).paid+=a;else get(mk.act).fc+=a;

  });

}

function groupItems(items,by){
  var G={};
  items.forEach(function(x){
    var k,l,r=x.r;
    if(by==='pj'){k=r.pj;l=r.pj+(labels[r.pj]?' · '+labels[r.pj]:'')}
    else if(by==='cdp'){k=owners[r.pj]||'~sans';l=owners[r.pj]||'Sans CdP'}
    else if(by==='jalon'){k=r.id;l=r.pj+' — '+(r.jalon||'sans nom')}
    else if(!x.d)return;
    else if(by==='semaine'){k=weekStr(x.d);var o=isoWeek(x.d);l='Semaine '+o.w+' · '+o.y}
    else{k=x.d.slice(0,7);l=monthLabel(k)}
    (G[k]||(G[k]={key:k,label:l,items:[]})).items.push(x);
  });
  var arr=Object.keys(G).map(function(k){
    var g=G[k],vals=g.items.map(function(x){return x.v});
    g.avg=vals.reduce(function(s,v){return s+v},0)/vals.length;g.max=Math.max.apply(null,vals);
    g.val=ecMeasure==='max'?g.max:g.avg;return g;
  });
  if(by==='pj'||by==='jalon'||by==='cdp')arr.sort(function(a,b){return b.val-a.val});
  else arr.sort(function(a,b){return a.key<b.key?-1:1});
  return arr;
}
function signed(n,dec){
  var v=dec?Math.round(n*10)/10:Math.round(n);
  return (v>0?'+':(v<0?'−':''))+Math.abs(v).toLocaleString('fr-FR')+' j';
}

var autoDelai=false;
function applyEdit(r,f,v){
  if(f==='epc'){r.epc=!!v;return}
  if(f==='produit'){if(v)r.produit=true;else delete r.produit;return}
  var prevInit=r.encInit,prevFI=r.factInit;
  if(f==='montant'||f==='delai'){
    var n=v===''?null:Number(v);r[f]=(n==null||isNaN(n))?null:n;
    if(f==='delai'&&r.delai!=null){
      var bs=r.factReelle||r.factPrevue;if(bs)r.encPrevue=addDays(bs,r.delai);
    }
  } else if(f==='jalon'||f==='ref'||f==='note'){r[f]=v.trim();return}
  else {
    r[f]=v||null;
    if(v&&(f==='factInit'||f==='factPrevue'||f==='factReelle')&&r.delai==null){r.delai=30;autoDelai=true}
    if(f==='factInit'&&(!r.factPrevue||r.factPrevue===prevFI)){
      r.factPrevue=r.factInit;
      if(r.factPrevue&&r.delai!=null)r.encPrevue=addDays(r.factPrevue,r.delai);
    }
    if(f==='factPrevue'&&r.factPrevue&&r.delai!=null)r.encPrevue=addDays(r.factPrevue,r.delai);
    if(f==='factReelle'&&r.delai!=null){var b2=v||r.factPrevue;if(b2)r.encPrevue=addDays(b2,r.delai)}
  }
  recalcInit(r);
  if(followInit(r)&&(!r.encPrevue||r.encPrevue===prevInit))r.encPrevue=r.encInit;
}
function onEdit(id,f,val){
  var r=byId(id);if(!r)return;
  var before=JSON.stringify(r),prev=r.encPrevue,prevInit=r.encInit;
  autoDelai=false;
  applyEdit(r,f,val);
  if(JSON.stringify(r)===before)return;
  if(f==='produit'){scheduleSave();render();toast(r.produit?'Jalon Produit : il remonte sur l\'accueil du responsable produit':'Jalon retiré de l\'accueil du responsable produit');return}
  if(f==='epc'){scheduleSave();render();toast(r.epc?'Jalon EPC : grisé, hors suivi des factures et encaissements':'Jalon réintégré dans le suivi');return}
  if(autoDelai&&f!=='delai') toast('Délai de paiement de 30 j appliqué, modifiable dans la colonne Délai. Encaissements calculés.');
  else if(f==='encReelle'&&val) toast('Jalon payé le '+fdate(val));
  else if(f==='factInit'&&r.encInit!==prevInit) toast('Encaissement initial calculé : '+fdate(r.encInit));
  else if(f==='delai'&&(r.encInit!==prevInit||r.encPrevue!==prev)) toast('Encaissements recalculés avec le nouveau délai');
  else if(r.encPrevue!==prev&&f==='factReelle') toast('Encaissement prévu recalculé : '+fdate(r.encPrevue));
  afterInline(id,f);
}

/* ---------- sauvegarde ---------- */
function setSave(s){
  var el=$('#save');el.className='save '+s;
  $('#saveTxt').textContent={ok:'Enregistré',dirty:'Modifié',saving:'Enregistrement…',error:'Échec de l’enregistrement',off:'Non enregistré : sauvegarde indisponible',load:'Chargement'}[s]||'';
}
function scheduleSave(){
  dirty=true;
  if(!dbRef){setSave('off');return}
  setSave('dirty');clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);
}
async function flush(){
  if(!dbRef)return;
  if(saving){saveTimer=setTimeout(flush,300);return}
  saving=true;setSave('saving');
  var payload=snapStr();
  try{
    var body=JSON.parse(payload);body.updatedAt=new Date().toISOString();
    await dbRef.set(body);
    lastSaved=payload;dirty=snapStr()!==payload;
    setSave(dirty?'dirty':'ok');
    if(dirty)saveTimer=setTimeout(flush,300);
  }catch(e){setSave('error')}
  finally{saving=false}
}
/* ---------- v146 : version intégrée au site (Manager › Cash in) ----------
   La page tourne dans un cadre du site. Elle ne parle pas à Firebase : elle échange des messages avec le site (même origine),
   qui lit et écrit le document Firestore « planning/cashin » (préfixe beta_ en bêta). Hors du site, elle garde son ancien mode. */
function applyIncoming(d){
  var inc={rows:d&&Array.isArray(d.rows)?d.rows:[],labels:(d&&d.labels&&typeof d.labels==='object')?d.labels:{},totals:(d&&d.totals&&typeof d.totals==='object')?d.totals:{},owners:(d&&d.owners&&typeof d.owners==='object')?d.owners:{}};
  var s=JSON.stringify(inc);
  if(!loaded||(s!==lastSaved&&!dirty&&!saving)){
    var o=JSON.parse(s);rows=o.rows;labels=o.labels;totals=o.totals;owners=o.owners||{};lastSaved=s;loaded=true;setSave('ok');
    var mig=normalize(rows);render();if(mig)scheduleSave();
    if(pendingGoto){var g0=pendingGoto;pendingGoto=null;gotoPj(g0)}
  }
}
// V146.1 : le site demande d'afficher les jalons d'un PJ (bouton « Ouvrir dans Cash in » de la fiche)
var pendingGoto=null;
function gotoPj(pj){
  if(!loaded){pendingGoto=pj;return}
  var k=String(pj||'').trim();if(!k)return;
  tab='jalons';query=k;filterStatus='all';$('#q').value=k;
  rows.forEach(function(r){if(String(r.pj).toUpperCase().indexOf(k.toUpperCase())===0)collapsed[r.pj]=false});
  renderTab();
}
function applyTheme(m){
  var root=document.documentElement;
  root.setAttribute('data-theme',m.mode==='dark'?'dark':'light');
  var v=m.vars||{};Object.keys(v).forEach(function(k){root.style.setProperty(k,v[k])});
}
function startBridge(){
  var pend={},seq=0,host=window.parent,origin=location.origin;
  dl={save:function(o){
    return new Promise(function(res){
      var url=URL.createObjectURL(o.data),a=document.createElement('a');
      a.href=url;a.download=o.filename;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);res({status:'saved'});
    });
  }};
  dbRef={set:function(body){
    return new Promise(function(res,rej){
      var id=++seq;pend[id]={res:res,rej:rej};
      host.postMessage({src:'cashin',type:'save',id:id,body:body},origin);
      setTimeout(function(){if(pend[id]){delete pend[id];rej(new Error('timeout'))}},20000);
    });
  }};
  window.addEventListener('message',function(e){
    if(e.source!==host||e.origin!==origin)return;
    var m=e.data;if(!m||m.src!=='cashin-host')return;
    if(m.type==='state')applyIncoming(m.exists?m.data:null);
    else if(m.type==='theme')applyTheme(m);
    else if(m.type==='goto')gotoPj(m.pj);

  });

function startDb(){
  if(window.parent&&window.parent!==window){startBridge();return}
  var c=window.claude;
  if(!c||!c.use){loaded=true;setSave('off');render();return}
  Promise.all([c.use('db').catch(function(){return null}),c.use('downloads').catch(function(){return null})]).then(function(res){
    var db=res[0];dl=res[1];
    if(!db){loaded=true;setSave('off');render();return}
    dbRef=db.doc('cashin/state');
    dbRef.onSnapshot(function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      var d=snap.exists?snap.data():null;
      var inc={rows:d&&Array.isArray(d.rows)?d.rows:[],labels:(d&&d.labels&&typeof d.labels==='object')?d.labels:{},totals:(d&&d.totals&&typeof d.totals==='object')?d.totals:{},owners:(d&&d.owners&&typeof d.owners==='object')?d.owners:{}};
      var s=JSON.stringify(inc);
      if(!loaded||(s!==lastSaved&&!dirty&&!saving)){
        var o=JSON.parse(s);rows=o.rows;labels=o.labels;totals=o.totals;owners=o.owners||{};lastSaved=s;loaded=true;setSave('ok');
        var mig=normalize(rows);render();if(mig)scheduleSave();
      }
    },function(){loaded=true;setSave('error');render()});
  });
}

var dragId=null;
function dropTarget(e){
  var tr=e.target.closest&&e.target.closest('tr.grp,tr.row,tr.addtr'),r=byId(dragId);
  if(!tr||!r)return null;
  var pj,before=null;
  if(tr.classList.contains('row')){var t=byId(tr.dataset.id);if(!t)return null;pj=t.pj;before=t.id}
  else{pj=tr.dataset.pj;if(tr.classList.contains('grp')){var f=rows.filter(function(x){return x.pj===pj})[0];before=f?f.id:null}}
  if(before===r.id)return null;
  return {tr:tr,pj:pj,before:before,r:r};
}

});
document.addEventListener('dragover',function(e){

});

  if(d.before){idx=rows.indexOf(byId(d.before))}
  else{var last=-1;rows.forEach(function(x,i){if(x.pj===d.pj)last=i});idx=last+1}
  r.pj=d.pj;rows.splice(idx,0,r);
  collapsed[d.pj]=false;dragId=null;scheduleSave();render();
